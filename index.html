<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Panduan UM Banjarmasin</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script>
    window.portalYouTubeReady = new Promise((resolve) => {
      window.onYouTubeIframeAPIReady = function () {
        resolve();
      };
    });
  </script>
  
  <script async src="https://www.youtube.com/iframe_api"></script>
  
  <style>
    .video-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  
    .video-frame iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById('app');
    let currentUser = JSON.parse(localStorage.getItem('portalUser') || 'null');
    let sessionToken = localStorage.getItem('portalToken');
    let activeModuleId = null;
    let activeVideos = [];
    let youtubePlayers = {};
    let watchStates = {};
    let playbackTimers = {};
    let completionLocks = {};

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function showLoading(message) {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="loading">
              <div class="spinner"></div>
              <span>${escapeHtml(message)}</span>
            </div>
          </section>
        </main>
      `;
    }

    function api(action, params = {}) {
      return new Promise((resolve, reject) => {
        if (!window.PORTAL_CONFIG || !PORTAL_CONFIG.API_URL) {
          reject(new Error('Alamat API belum diatur pada config.js.'));
          return;
        }

        const callback = `portalCallback_${Date.now()}_${Math.random()
          .toString(36).slice(2)}`;

        const query = new URLSearchParams({
          action,
          callback,
          ...params
        });

        const script = document.createElement('script');

        window[callback] = response => {
          delete window[callback];
          script.remove();

          if (response.success) resolve(response.data);
          else reject(new Error(response.message || 'Permintaan gagal.'));
        };

        script.onerror = () => {
          delete window[callback];
          script.remove();
          reject(new Error('Koneksi ke server gagal.'));
        };

        script.src = `${PORTAL_CONFIG.API_URL}?${query.toString()}`;
        document.head.appendChild(script);
      });
    }

    function setupTanggalLahir() {
      const dateInput = document.getElementById('tanggalLahir');
      const displayInput = document.getElementById('tanggalLahirDisplay');
    
      if (!dateInput || !displayInput) return;
    
      displayInput.addEventListener('click', function () {
        if (typeof dateInput.showPicker === 'function') {
          dateInput.showPicker();
        } else {
          dateInput.click();
        }
      });
    
      dateInput.addEventListener('change', function () {
        if (!this.value) {
          displayInput.value = '';
          return;
        }
    
        const [year, month, day] = this.value.split('-');
    
        displayInput.value = `${day}/${month}/${year}`;
      });
    }
    
    function renderLogin() {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <img
                src="Logo.webp"
                alt="Universitas Muhammadiyah Banjarmasin"
                class="portal-logo"
              >
            
              <h1>Portal Panduan UM Banjarmasin</h1>
            
              <p>
                Masuk untuk mengakses dan menyelesaikan panduan untuk Anda.
              </p>
            </div>

            <form id="loginForm">
              <label for="loginId">NIM atau Username</label>
              <input id="loginId" type="text" required autocomplete="username">

              <label for="tanggalLahirDisplay">Tanggal Lahir</label>

              <input
                id="tanggalLahirDisplay"
                type="text"
                placeholder="DD/MM/YYYY"
                readonly
              >
              
              <input
                id="tanggalLahir"
                type="date"
                style="position:absolute; opacity:0; width:1px; height:1px;"
              >

              <button id="loginButton" type="submit">Masuk</button>
              <div id="message" class="message" role="alert"></div>
            </form>
          </section>
        </main>
      `;

      document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();

        const button = document.getElementById('loginButton');
        const message = document.getElementById('message');
        button.disabled = true;
        button.textContent = 'Memeriksa data...';
        message.className = 'message';

        try {
          const result = await api('login', {
            loginId: document.getElementById('loginId').value.trim(),
            tanggalLahir: document.getElementById('tanggalLahir').value
          });

          currentUser = result.user;
          sessionToken = result.token;
          localStorage.setItem('portalUser', JSON.stringify(currentUser));
          localStorage.setItem('portalToken', sessionToken);
                   
          if (String(currentUser.role).toLowerCase() === 'admin') {
            renderAdminDashboard();
          } else {
            renderDashboard();
          }
        } 
        catch (error) {
          message.className = 'message error';
          message.textContent = error.message;
          button.disabled = false;
          button.textContent = 'Masuk';
        }
      });
      setupTanggalLahir();
    }

    async function renderDashboard() {
      showLoading('Memuat portal...');

      try {
        const result = await api('modules', { token: sessionToken });
        const modules = result.modules || [];

        const daftarModul = modules.length
          ? modules.map(module => {
              const progress = `${module.video_selesai || 0} dari ${module.total_video || 0} video selesai`;
        
              let action;
        
              if (module.deklarasi_disetujui) {
                action = `
                  <p style="color:#006747;font-weight:bold;margin-top:16px;">
                    ✓ Modul telah difinalisasi
                  </p>
                `;
              } else if (module.selesai) {
                action = `
                  <button type="button"
                    onclick="showModuleDocuments('${escapeHtml(module.module_id)}')">
                    📎 Lengkapi Berkas & Finalisasi
                  </button>
                `;
              } else {
                action = `
                  <button type="button"
                    onclick="openModule('${escapeHtml(module.module_id)}')">
                    Buka Modul
                  </button>
                `;
              }
        
              return `
                <article class="module">
                  <h2>${escapeHtml(module.nama_modul)}</h2>
                  <p>${escapeHtml(module.deskripsi)}</p>
                  <p style="font-size:13px;color:#64748b;margin:12px 0 0;">
                    Progress: ${progress}
                  </p>
                  ${action}
                </article>
              `;
            }).join('')
          : '<p class="empty">Belum ada modul yang tersedia untuk akun Anda.</p>';
        
        app.innerHTML = `
          <main class="container">
            <section class="card">
              <div class="brand">
                <img
                  src="Logo.webp"
                  alt="Universitas Muhammadiyah Banjarmasin"
                  class="portal-logo"
                >
                <h1>Halo, ${escapeHtml(currentUser.nama)}</h1>
                <p>Nomor Induk Mahasiswa (NIM): ${escapeHtml(currentUser.nim || 'Mahasiswa')}</p>
                <p>Program Studi: ${escapeHtml(currentUser.prodi || 'Mahasiswa')}</p>
                <br></br>
                <p>Pilih panduan yang perlu Anda selesaikan.</p>
              </div>

              ${daftarModul}
              
              <button class="logout" type="button" onclick="logout()">Keluar</button>
            </section>
          </main>
        `;
      } catch (error) {
        logout();
      }
    }

    async function renderAdminDashboard() {
      showLoading('Memuat dashboard admin...');
    
      try {
        const result = await api('adminDashboard', {
          token: sessionToken
        });
    
        const mahasiswa = result.mahasiswa || [];
    
        const daftarMahasiswa = mahasiswa.length
          ? mahasiswa.map(user => `
              <article class="module">
                <h2>${escapeHtml(user.nama)}</h2>
                <p>${escapeHtml(user.nim)} · ${escapeHtml(user.prodi)}</p>
                <p style="font-size:13px;color:#64748b;margin:12px 0 0;">
                  Modul selesai: ${user.modul_selesai} dari ${user.total_modul}<br>
                  Finalisasi: ${user.finalisasi} dari ${user.total_modul}
                </p>
              </article>
            `).join('')
          : '<p class="empty">Belum ada mahasiswa aktif.</p>';
    
        app.innerHTML = `
          <main class="container">
            <section class="card">
              <div class="brand">
                <h1>Dashboard Admin</h1>
                <p>Ringkasan penyelesaian panduan mahasiswa.</p>
              </div>
    
              <article class="module">
                <h2>Total Mahasiswa</h2>
                <p style="font-size:30px;font-weight:bold;color:#006747;margin:8px 0;">
                  ${result.total_mahasiswa || 0}
                </p>
              </article>
    
              ${daftarMahasiswa}
    
              <button type="button" onclick="renderAdminDashboard()">
                Muat Ulang Data
              </button>
    
              <button class="logout" type="button" onclick="logout()">
                Keluar
              </button>
            </section>
          </main>
        `;
      } catch (error) {
        alert(error.message);
        logout();
      }
    }
    
    async function openModule(moduleId) {

      /*
       * Pastikan ID modul selalu disimpan secara global.
       */
      activeModuleId = String(moduleId || '').trim();
    
      if (!activeModuleId) {
        alert('ID modul tidak ditemukan.');
        return;
      }
    
      showLoading();
    
      try {
    
        const result = await api(
          'videos',
          {
            token: sessionToken,
            moduleId: activeModuleId
          }
        );
    
        renderModule(
          activeModuleId,
          result.videos || []
        );
    
      } catch (error) {
    
        console.error(
          'Gagal membuka modul:',
          error
        );
    
        alert(
          error.message ||
          'Modul tidak dapat dibuka.'
        );
      }
    }

    function watchAgain(videoId) {
      const player =
        youtubePlayers[videoId];
    
      if (!player) return;
    
      player.seekTo(0, true);
      player.playVideo();
    }

    function renderModule(moduleId, videos) {
      destroyYouTubePlayers();
      activeModuleId =
        String(moduleId || '').trim();
    
      activeVideos =
        videos || [];

      activeVideos.forEach(video => {
      
        video._moduleId =
          activeModuleId;
      
        const watchState =
          getWatchState(video.video_id);
      
        /*
         * Video selesai ditonton,
         * tetapi quiz belum diselesaikan.
         */
        if (
          !video.selesai &&
          watchState.videoSelesai === true
        ) {
          video._videoSelesai = true;
        }
      
      });
      // Server/Spreadsheet menjadi sumber status resmi.
      // Progress lokal yang tersisa hanya dipakai untuk sesi aktif.
     
      const daftarVideo = videos.length
        ? videos.map((video, index) => {
            const videoSebelumnya =
              index > 0
                ? videos[index - 1]
                : null;
            
            const terbuka =
              index === 0 ||
              videos[index - 1].selesai === true;

            if (!terbuka) {
              return `
                <article class="module ${video.selesai ? 'video-completed' : ''}">
                  <h2>${index + 1}. ${escapeHtml(video.judul)}</h2>
                  <p>Video ini akan terbuka setelah video sebelumnya diselesaikan.</p>
                </article>
              `;
            }

            const status =
              video.selesai
                ? `
                  <div class="video-completed-status">
                    ✓ Video dan kuis telah diselesaikan
                  </div>
            
                  <button
                    class="btn-secondary"
                    onclick="watchAgain('${escapeHtml(video.video_id)}')">
                    ↻ Tonton Kembali
                  </button>
                `
            
                : video._videoSelesai
                  ? `
                    <div class="video-completed-status">
                      ✓ Video telah selesai ditonton
                    </div>
            
                    <button
                      type="button"
                      onclick="openQuiz(
                        '${escapeHtml(activeModuleId)}',
                        '${escapeHtml(video.video_id)}'
                      )">
                      Lanjut ke Quiz
                    </button>
            
                    <div style="
                      margin-top:10px;
                      font-size:13px;
                      color:#64748b;
                    ">
                      Selesaikan quiz untuk membuka video berikutnya.
                    </div>
                  `
            
                  : `
                    <div
                      id="watch-status-${escapeHtml(video.video_id)}">
                    </div>
                  `;

            return `
              <article class="module">
                <h2>${index + 1}. ${escapeHtml(video.judul)}</h2>
              
                <div
                  class="video-wrapper ${video.orientasi === 'vertical'
                    ? 'video-vertical'
                    : 'video-horizontal'}"
                  id="video-wrapper-${escapeHtml(video.video_id)}">
                
                  <div
                    id="youtube-player-${escapeHtml(video.video_id)}"
                    class="video-frame">
                  </div>
                
                  <div
                    id="video-lock-${escapeHtml(video.video_id)}"
                    class="video-lock"
                    onclick="startWatching('${escapeHtml(video.video_id)}')">
                
                    <div class="video-lock-content">
                      <div class="play-icon">▶</div>
                
                      <strong>
                        ${getWatchState(video.video_id).position > 0
                          ? 'Lanjutkan Menonton'
                          : 'Mulai Menonton'}
                      </strong>
                
                      <span>
                        ${getWatchState(video.video_id).position > 0
                          ? `Lanjut dari ${formatVideoTime(
                              getWatchState(video.video_id).position
                            )}`
                          : 'Klik untuk memulai video'}
                      </span>
                    </div>
                  </div>
                
                </div>
                
                <div
                  class="watch-status"
                  id="watch-status-${escapeHtml(video.video_id)}">
                  ${video.selesai
                    ? '✓ Video telah selesai'
                    : getWatchState(video.video_id).position > 0
                      ? `Lanjut dari ${formatVideoTime(
                          getWatchState(video.video_id).position
                        )}`
                      : 'Wajib ditonton sampai selesai'}
                </div>
              
                ${status}
              </article>
            `;
          }).join('')
        : '<p class="empty">Belum ada video pada modul ini.</p>';

      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <img
                  src="Logo.webp"
                  alt="Universitas Muhammadiyah Banjarmasin"
                  class="portal-logo"
              >
              <h1>Materi Video</h1>
              <p>Selesaikan video secara berurutan.</p>
            </div>

            ${daftarVideo}

            <button class="logout" type="button" onclick="renderDashboard()">
              Kembali ke Daftar Modul
            </button>
          </section>
        </main>
      `;
    }

    function extractYouTubeId(url) {
      if (!url) return null;
    
      const value = String(url).trim();
    
      // youtube.com/shorts/VIDEO_ID
      let match = value.match(/youtube\.com\/shorts\/([^?&/]+)/i);
      if (match) return match[1];
    
      // youtube.com/watch?v=VIDEO_ID
      match = value.match(/[?&]v=([^?&]+)/i);
      if (match) return match[1];
    
      // youtu.be/VIDEO_ID
      match = value.match(/youtu\.be\/([^?&/]+)/i);
      if (match) return match[1];
    
      // youtube.com/embed/VIDEO_ID
      match = value.match(/youtube\.com\/embed\/([^?&/]+)/i);
      if (match) return match[1];
    
      return null;
    }
    
    
    function getWatchKey(videoId) {
      const userId = currentUser?.user_id || 'guest';
      return `portalWatch_${userId}_${videoId}`;
    }
    
    
    function getWatchState(videoId) {
      try {
        const raw = localStorage.getItem(
          getWatchKey(videoId)
        );
    
        if (!raw) {
          return {
            position: 0,
            maxWatched: 0,
            savedAt: 0,
            videoSelesai: false
          };
        }
    
        const data = JSON.parse(raw);
    
        return {
          position: Number(data.position) || 0,
          maxWatched: Number(data.maxWatched) || 0,
          savedAt: Number(data.savedAt) || 0,
          videoSelesai: data.videoSelesai === true
        };
    
      } catch (error) {
        return {
          position: 0,
          maxWatched: 0,
          savedAt: 0,
          videoSelesai: false
        };
      }
    }
    
    
    function saveWatchState(videoId, state) {
      try {
        localStorage.setItem(
          getWatchKey(videoId),
          JSON.stringify({
            position: Math.max(
              0,
              Number(state.position) || 0
            ),
    
            maxWatched: Math.max(
              0,
              Number(state.maxWatched) || 0
            ),
    
            videoSelesai:
              state.videoSelesai === true,
    
            savedAt: Date.now()
          })
        );
    
      } catch (error) {
        console.warn(
          'Gagal menyimpan posisi video:',
          error
        );
      }
    }
    
    
    function formatVideoTime(seconds) {
      seconds = Math.max(0, Math.floor(Number(seconds) || 0));
    
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
    
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
    
      return `${minutes}:${String(secs).padStart(2, '0')}`;
    }
    
    
    function updateWatchStatus(video) {
      const statusElement = document.getElementById(
        `watch-status-${video.video_id}`
      );
    
      if (!statusElement) return;
    
      const player = youtubePlayers[video.video_id];
      const state = getWatchState(video.video_id);
    
      let duration = Number(video.durasi_detik) || 0;
      let position = Number(state.position) || 0;
    
      if (player && typeof player.getDuration === 'function') {
        const playerDuration = Number(player.getDuration()) || 0;
    
        if (playerDuration > 0) {
          duration = playerDuration;
        }
    
        if (typeof player.getCurrentTime === 'function') {
          position = Number(player.getCurrentTime()) || position;
        }
      }
    
      if (video.selesai) {
        statusElement.innerHTML = `
          <span>✓ Video dan kuis telah diselesaikan</span>
        `;
        return;
      }
      
      if (video._videoSelesai) {
        statusElement.innerHTML = `
          <span>✓ Video telah selesai ditonton</span>
        `;
        return;
      }
    
      if (position > 1) {
        statusElement.innerHTML = `
          <span>
            Lanjut dari ${formatVideoTime(position)}
            ${duration ? ` / ${formatVideoTime(duration)}` : ''}
          </span>
        `;
      } else {
        statusElement.innerHTML = `
          <span>Wajib ditonton sampai selesai</span>
        `;
      }
    }
    
    
    async function waitForYouTubeAPI() {
      if (window.YT && typeof YT.Player === 'function') {
        return;
      }
    
      if (window.portalYouTubeReady) {
        await window.portalYouTubeReady;
      }
    
      if (!window.YT || typeof YT.Player !== 'function') {
        throw new Error('YouTube Player API belum tersedia.');
      }
    }
    
    
    function clearPlaybackTimer(videoId) {
      if (playbackTimers[videoId]) {
        clearInterval(playbackTimers[videoId]);
        delete playbackTimers[videoId];
      }
    }
    
    
    function saveCurrentVideoPosition(video) {
      if (!video || video.selesai) return;
    
      const player = youtubePlayers[video.video_id];
    
      if (!player || typeof player.getCurrentTime !== 'function') {
        return;
      }
    
      try {
        const currentTime = Number(player.getCurrentTime()) || 0;
        const state = getWatchState(video.video_id);
    
        state.position = currentTime;
    
        if (currentTime <= state.maxWatched + 2) {
          state.maxWatched = Math.max(
            state.maxWatched,
            currentTime
          );
        }
    
        saveWatchState(video.video_id, state);
    
      } catch (error) {
        console.warn('Gagal menyimpan posisi video:', error);
      }
    }
    
    
    function startPlaybackMonitor(video) {
      if (!video || video.selesai) return;
    
      clearPlaybackTimer(video.video_id);
    
      let lastSave = 0;
      let lastStatusUpdate = 0;
    
      playbackTimers[video.video_id] = setInterval(() => {
    
        const player = youtubePlayers[video.video_id];
    
        if (!player) return;
    
        try {
          const currentTime =
            Number(player.getCurrentTime()) || 0;
    
          const duration =
            Number(player.getDuration()) || 0;
    
          const state =
            getWatchState(video.video_id);
    
          /*
           * 1. Paksa kecepatan normal 1x.
           */
          if (
            typeof player.getPlaybackRate === 'function' &&
            typeof player.setPlaybackRate === 'function'
          ) {
            const rate = player.getPlaybackRate();
    
            if (rate !== 1) {
              player.setPlaybackRate(1);
            }
          }
    
    
          /*
           * 2. Cegah seek maju.
           *
           * Toleransi 2 detik diberikan agar tidak salah
           * mendeteksi perpindahan kecil karena buffering.
           */
          const allowedForward =
            state.maxWatched + 2;
    
          if (currentTime > allowedForward) {
    
            const returnPosition =
              Math.max(0, state.maxWatched);
    
            player.seekTo(
              returnPosition,
              true
            );
    
            state.position = returnPosition;
    
            saveWatchState(
              video.video_id,
              state
            );
    
            return;
          }
    
    
          /*
           * 3. Posisi terjauh yang sah.
           *
           * Rewind diperbolehkan.
           */
          if (currentTime > state.maxWatched) {
            state.maxWatched = currentTime;
          }
          
          state.position = currentTime;
          
          
          /*
           * Jika sudah mencapai titik completion,
           * pastikan posisi tersebut tersimpan.
           *
           * Contoh:
           * Durasi = 103 detik
           * Toleransi = 7 detik
           * Completion point = 96 detik
           */
          if (duration > 0) {
          
            const completionPoint =
              Math.max(
                0,
                duration - 7
              );
          
            if (
              currentTime >= completionPoint &&
              state.maxWatched < completionPoint
            ) {
              state.maxWatched = currentTime;
            }
          }
    
    
          /*
           * 4. Simpan setiap ±1 detik ke localStorage.
           * Tidak ada request ke Google Sheets.
           */
          const now = Date.now();
    
          if (now - lastSave >= 1000) {
            saveWatchState(
              video.video_id,
              state
            );
    
            lastSave = now;
          }
    
    
          /*
           * 5. Update teks status tidak perlu setiap 250 ms.
           */
          if (now - lastStatusUpdate >= 1000) {
    
            updateWatchStatus(video);
    
            lastStatusUpdate = now;
          }
    
    
          /*
           * 6. Pengaman tambahan:
           * Jika duration sudah diketahui dan posisi mendekati
           * akhir, biarkan YouTube menyelesaikan video secara normal.
           */
          if (
            duration > 0 &&
            currentTime >= duration - 1
          ) {
            state.maxWatched =
              Math.max(state.maxWatched, currentTime);
    
            state.position = currentTime;
    
            saveWatchState(
              video.video_id,
              state
            );
          }
    
        } catch (error) {
          console.warn(
            'Playback monitor error:',
            error
          );
        }
    
      }, 250);
    }
    
    
    async function createYouTubePlayer(
      video,
      options = {}
    ) {
      const videoId = video.video_id;
    
      if (youtubePlayers[videoId]) {
        return youtubePlayers[videoId];
      }
    
      await waitForYouTubeAPI();
    
      const container =
        document.getElementById(
          `youtube-player-${videoId}`
        );
    
      if (!container) {
        throw new Error(
          `Container video ${videoId} tidak ditemukan.`
        );
      }
    
      const youtubeId =
        extractYouTubeId(video.url_video);
    
      if (!youtubeId) {
        throw new Error(
          'URL YouTube tidak valid.'
        );
      }
    
      const savedState =
        getWatchState(videoId);
    
      return new Promise((resolve, reject) => {
    
        let resolved = false;
    
        const player =
          new YT.Player(container, {
    
            videoId: youtubeId,
    
            width: '100%',
            height: '100%',
    
            playerVars: {
              autoplay: 0,
              controls: 1,
              rel: 0,
              playsinline: 1,
              fs: 1,
              iv_load_policy: 3,
              disablekb: 1,
              modestbranding: 1,
              origin: window.location.origin
            },
    
            events: {
    
              onReady: function (event) {
    
                youtubePlayers[videoId] =
                  event.target;
    
    
                /*
                 * Pastikan playback 1x.
                 */
                try {
                  event.target.setPlaybackRate(1);
                } catch (e) {}
    
    
                /*
                 * Ambil durasi asli dari YouTube.
                 */
                try {
                  const duration =
                    Number(
                      event.target.getDuration()
                    ) || 0;
    
                  if (duration > 0) {
                    video.durasi_detik =
                      duration;
                  }
                } catch (e) {}
    
    
                /*
                 * Tentukan posisi awal.
                 */
                if (options.reset) {
    
                  event.target.seekTo(
                    0,
                    true
                  );
    
                } else if (
                  !video.selesai &&
                  !video._videoSelesai
                ) {
    
                  const startPosition =
                    Math.min(
                      Math.max(
                        0,
                        savedState.position
                      ),
                      Math.max(
                        savedState.maxWatched,
                        savedState.position
                      )
                    );
    
                  if (startPosition > 0) {
                    event.target.seekTo(
                      startPosition,
                      true
                    );
                  }
                }
    
    
                /*
                 * Hilangkan overlay "Mulai Menonton".
                 */
                const lock =
                  document.getElementById(
                    `video-lock-${videoId}`
                  );
    
                if (lock) {
                  lock.style.display = 'none';
                }
    
    
                updateWatchStatus(video);
    
    
                /*
                 * Play hanya jika berasal dari tombol user.
                 */
                if (options.autoplay) {
    
                  try {
                    event.target.playVideo();
                  } catch (e) {
                    console.warn(
                      'Autoplay tidak dapat dijalankan:',
                      e
                    );
                  }
                }
    
    
                if (!resolved) {
                  resolved = true;
                  resolve(event.target);
                }
              },
    
    
              onStateChange: function (event) {
                handleYouTubeStateChange(
                  video,
                  event
                );
              },
    
    
              onError: function (event) {
    
                console.error(
                  'YouTube Player Error:',
                  event.data
                );
    
                if (!resolved) {
                  resolved = true;
    
                  reject(
                    new Error(
                      `YouTube Player Error: ${event.data}`
                    )
                  );
                }
              }
    
            }
    
          });
    
    
        /*
         * Simpan instance sementara.
         */
        youtubePlayers[videoId] =
          player;
    
      });
    }
    
    
    function handleYouTubeStateChange(video, event) {

      const player =
        youtubePlayers[video.video_id];
    
      if (!player) return;
    
    
      /*
       * Video yang sudah selesai boleh diputar ulang
       * dan tidak terkena pembatas anti-seek.
       */
      if (video.selesai || video._videoSelesai) {
    
        if (
          event.data === YT.PlayerState.ENDED
        ) {
    
          clearPlaybackTimer(
            video.video_id
          );
    
          updateWatchStatus(video);
        }
    
        return;
      }
    
    
      /*
       * VIDEO SEDANG DIPUTAR
       */
      if (
        event.data === YT.PlayerState.PLAYING
      ) {
    
        startPlaybackMonitor(video);
    
        return;
      }
    
    
      /*
       * VIDEO DI-PAUSE
       */
      if (
        event.data === YT.PlayerState.PAUSED
      ) {
    
        clearPlaybackTimer(
          video.video_id
        );
    
        saveCurrentVideoPosition(video);
    
        updateWatchStatus(video);
    
        return;
      }
    
    
      /*
       * BUFFERING
       */
      if (
        event.data === YT.PlayerState.BUFFERING
      ) {
    
        saveCurrentVideoPosition(video);
    
        return;
      }
    
    
      /*
       * VIDEO SELESAI
       */
      if (
        event.data === YT.PlayerState.ENDED
      ) {
    
        clearPlaybackTimer(
          video.video_id
        );
    
    
        let playerDuration = 0;
        let currentTime = 0;
    
    
        try {
    
          playerDuration =
            Number(
              player.getDuration()
            ) || 0;
    
          currentTime =
            Number(
              player.getCurrentTime()
            ) || 0;
    
        } catch (error) {
    
          console.warn(
            'Tidak dapat membaca durasi video:',
            error
          );
        }
    
    
        const state =
          getWatchState(
            video.video_id
          );
    
    
        /*
         * =====================================================
         * PENTING
         * =====================================================
         *
         * YouTube pada beberapa HP/browser dapat:
         *
         * Durasi     : 1:43
         * END        : sekitar 1:42
         *
         * Karena itu kita tidak meminta currentTime harus
         * sama persis dengan duration.
         *
         * Video dianggap sudah mencapai batas completion
         * jika maxWatched sudah berada 7 detik sebelum durasi.
         */
        const COMPLETION_TOLERANCE = 7;

        const completionPoint =
          Math.max(
            0,
            playerDuration - COMPLETION_TOLERANCE
          );
    
    
        /*
         * Kalau durasi YouTube tersedia.
         */
        if (playerDuration > 0) {
    
          const completionPoint =
            Math.max(
              0,
              playerDuration -
              COMPLETION_TOLERANCE
            );
    
    
          const watchedUntilCompletion =
            state.maxWatched >=
            completionPoint;
    
    
          /*
           * =================================================
           * SUDAH MENONTON SAMPAI BATAS YANG DITENTUKAN
           * =================================================
           */
          if (watchedUntilCompletion) {
    
            state.position =
              playerDuration;
    
            state.maxWatched =
              playerDuration;
    
            saveWatchState(
              video.video_id,
              state
            );
    
    
            /*
             * Tandai selesai.
             */
            finishVideo(video);
    
            return;
          }
    
    
          /*
           * =================================================
           * BELUM MENONTON SAMPAI BATAS
           * =================================================
           *
           * Kemungkinan user melakukan seek langsung
           * ke akhir video.
           *
           * Kembalikan ke posisi terakhir yang sah.
           */
          const returnPosition =
            Math.max(
              0,
              Math.min(
                state.maxWatched,
                playerDuration - 1
              )
            );
    
    
          state.position =
            returnPosition;
    
          saveWatchState(
            video.video_id,
            state
          );
    
    
          try {
    
            player.seekTo(
              returnPosition,
              true
            );
    
            player.playVideo();
    
          } catch (error) {
    
            console.warn(
              'Gagal melanjutkan video:',
              error
            );
          }
    
    
          updateWatchStatus(video);
    
          return;
        }
    
    
        /*
         * =====================================================
         * FALLBACK
         * =====================================================
         *
         * Kalau YouTube tidak memberikan duration,
         * gunakan posisi aktual yang sudah ditonton.
         *
         * Jika sudah lebih dari 95 detik, kita anggap selesai.
         *
         * Angka ini hanya fallback, bukan kondisi normal.
         */
        if (
          state.maxWatched >= 95 ||
          currentTime >= 95
        ) {
    
          finishVideo(video);
    
          return;
        }
    
    
        /*
         * Jika tidak memenuhi syarat,
         * kembali ke posisi terakhir yang valid.
         */
        try {
    
          player.seekTo(
            state.maxWatched,
            true
          );
    
          player.playVideo();
    
        } catch (error) {
    
          console.warn(
            'Gagal mengembalikan posisi video:',
            error
          );
        }
      }
    }
    
    async function finishVideo(video) {
      const videoId =
        String(video?.video_id || '').trim();
    
      const moduleId =
        String(
          video?._moduleId ||
          activeModuleId ||
          ''
        ).trim();
    
      if (!moduleId || !videoId) {
        alert('Data video atau modul tidak ditemukan.');
        return;
      }
    
      if (completionLocks[videoId]) {
        return;
      }
    
      completionLocks[videoId] = true;
    
      /*
       * =====================================================
       * TAMPILKAN STATUS SEGERA
       * =====================================================
       */
    
      const statusElement =
        document.getElementById(
          `watch-status-${videoId}`
        );
    
      if (statusElement) {
        statusElement.innerHTML = `
          <div style="
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px;
            border-radius:10px;
            background:#f1f5f9;
            color:#475569;
            font-size:14px;
          ">
            <span class="loading-spinner"></span>
    
            <span>
              Video selesai ditonton.<br>
              <strong>Mohon tunggu, sedang menyiapkan langkah berikutnya...</strong>
            </span>
          </div>
        `;
      }
    
      try {
    
        /*
         * =====================================================
         * SIMPAN STATUS VIDEO SELESAI DI LOCAL STORAGE
         * =====================================================
         */
    
        const state =
          getWatchState(videoId);
    
        state.position = 0;
    
        state.maxWatched =
          Number(video.durasi_detik) || state.maxWatched;
    
        state.videoSelesai = true;
    
        saveWatchState(
          videoId,
          state
        );
    
    
        /*
         * =====================================================
         * CEK QUIZ
         * =====================================================
         */
    
        const quizResult =
          await api('quiz', {
            token: sessionToken,
            moduleId: moduleId,
            videoId: videoId
          });
    
        const questions =
          quizResult?.questions || [];
    
    
        /*
         * =====================================================
         * ADA QUIZ
         * =====================================================
         */
    
        if (questions.length > 0) {
    
          const completedIndex =
            activeVideos.findIndex(
              item =>
                String(item.video_id) === videoId
            );
    
          if (completedIndex !== -1) {
    
            activeVideos[
              completedIndex
            ]._videoSelesai = true;
    
            activeVideos[
              completedIndex
            ]._moduleId = moduleId;
          }
    
    
          destroyYouTubePlayers();
    
          renderModule(
            moduleId,
            activeVideos
          );
    
          return;
        }
    
    
        /*
         * =====================================================
         * TIDAK ADA QUIZ
         * =====================================================
         */
    
        await api('completeVideo', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId
        });
    
    
        const completedIndex =
          activeVideos.findIndex(
            item =>
              String(item.video_id) === videoId
          );
    
        if (completedIndex !== -1) {
    
          activeVideos[
            completedIndex
          ].selesai = true;
    
          activeVideos[
            completedIndex
          ]._videoSelesai = true;
    
          activeVideos[
            completedIndex
          ]._moduleId = moduleId;
        }
    
    
        /*
         * Video tanpa quiz langsung
         * membuka video berikutnya.
         */
    
        destroyYouTubePlayers();
    
        renderModule(
          moduleId,
          activeVideos
        );
    
      } catch (error) {
    
        console.error(
          'Gagal menyelesaikan video:',
          error
        );
    
        alert(
          error.message ||
          'Video selesai, tetapi proses berikutnya gagal.'
        );
    
      } finally {
    
        delete completionLocks[videoId];
    
      }
    }
    
    async function startWatching(videoId) {
    
      const video =
        activeVideos.find(
          item =>
            item.video_id === videoId
        );
    
      if (!video) return;
    
    
      try {
    
        const player =
          await createYouTubePlayer(
            video,
            {
              autoplay: true,
              reset: false
            }
          );
    
    
        const state =
          getWatchState(videoId);
    
    
        /*
         * Pastikan posisi terakhir digunakan.
         */
        if (
          state.position > 0 &&
          !video.selesai
        ) {
    
          const duration =
            Number(
              player.getDuration()
            ) || 0;
    
          const position =
            duration > 0
              ? Math.min(
                  state.position,
                  duration - 1
                )
              : state.position;
    
          player.seekTo(
            Math.max(0, position),
            true
          );
        }
    
    
        try {
          player.playVideo();
        } catch (error) {
          console.warn(
            'Gagal menjalankan video:',
            error
          );
        }
    
      } catch (error) {
    
        console.error(
          'Gagal membuat YouTube player:',
          error
        );
    
        alert(
          'Video tidak dapat dimuat. Silakan coba lagi.'
        );
      }
    }
    
    
    async function watchAgain(videoId) {
    
      const video =
        activeVideos.find(
          item =>
            item.video_id === videoId
        );
    
      if (!video) return;
    
    
      try {
    
        let player =
          youtubePlayers[videoId];
    
    
        /*
         * Player belum dibuat → lazy-load.
         */
        if (!player) {
    
          player =
            await createYouTubePlayer(
              video,
              {
                autoplay: true,
                reset: true
              }
            );
    
        } else {
    
          /*
           * Replay selalu dimulai dari awal.
           */
          player.seekTo(
            0,
            true
          );
    
          player.playVideo();
        }
    
    
        updateWatchStatus(video);
    
      } catch (error) {
    
        console.error(
          'Gagal memutar ulang video:',
          error
        );
    
        alert(
          'Video tidak dapat diputar ulang. Silakan coba lagi.'
        );
      }
    }
    
    
    function destroyYouTubePlayers() {
    
      /*
       * Hentikan seluruh timer.
       */
      Object.keys(playbackTimers)
        .forEach(videoId => {
          clearPlaybackTimer(videoId);
        });
    
    
      /*
       * Simpan posisi terakhir sebelum player dihancurkan.
       */
      Object.keys(youtubePlayers)
        .forEach(videoId => {
    
          const video =
            activeVideos.find(
              item =>
                item.video_id === videoId
            );
    
          if (
            video &&
            !video.selesai
          ) {
            saveCurrentVideoPosition(
              video
            );
          }
        });
    
    
      /*
       * Destroy player YouTube.
       */
      Object.keys(youtubePlayers)
        .forEach(videoId => {
    
          try {
    
            const player =
              youtubePlayers[videoId];
    
            if (
              player &&
              typeof player.destroy === 'function'
            ) {
              player.destroy();
            }
    
          } catch (error) {
            console.warn(
              'Gagal destroy player:',
              error
            );
          }
        });
    
    
      youtubePlayers = {};
    }
    
    
    document.addEventListener(
      'visibilitychange',
      function () {
    
        /*
         * Mahasiswa pindah tab / minimize browser.
         */
        if (
          document.visibilityState === 'hidden'
        ) {
    
          Object.keys(youtubePlayers)
            .forEach(videoId => {
    
              const video =
                activeVideos.find(
                  item =>
                    item.video_id === videoId
                );
    
              if (
                !video ||
                video.selesai
              ) {
                return;
              }
    
    
              saveCurrentVideoPosition(
                video
              );
    
    
              const player =
                youtubePlayers[videoId];
    
              try {
    
                if (
                  player &&
                  typeof player.pauseVideo === 'function'
                ) {
                  player.pauseVideo();
                }
    
              } catch (error) {}
            });
    
        }
      }
    );
    
    
    window.addEventListener(
      'pagehide',
      function () {
    
        Object.keys(youtubePlayers)
          .forEach(videoId => {
    
            const video =
              activeVideos.find(
                item =>
                  item.video_id === videoId
              );
    
            if (
              video &&
              !video.selesai
            ) {
              saveCurrentVideoPosition(
                video
              );
            }
          });
      }
    );
    
    async function openQuiz(moduleId, videoId) {
      showLoading('Menyiapkan kuis...');

      try {
        const result = await api('quiz', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId
        });

        const questions = result.questions || [];

        if (!questions.length) {
          await completeVideo(moduleId, videoId);
          return;
        }

        renderQuiz(moduleId, videoId, questions);
      } catch (error) {
        alert(error.message);
        openModule(moduleId);
      }
    }

    function renderQuiz(moduleId, videoId, questions) {
      const questionHtml = questions.map((question, index) => `
        <article class="module">
          <h2>Soal ${index + 1}</h2>
          <p style="font-weight:bold; color:#1c2d26;">
            ${escapeHtml(question.pertanyaan)}
          </p>

          ${['A', 'B', 'C', 'D'].map(option => `
            <label style="font-weight:normal; display:flex; gap:10px; align-items:flex-start; margin:13px 0;">
              <input type="radio" required
                name="${escapeHtml(question.question_id)}"
                value="${option}"
                style="width:auto; margin-top:2px;">
              <span>${option}. ${escapeHtml(question[`opsi_${option.toLowerCase()}`])}</span>
            </label>
          `).join('')}
        </article>
      `).join('');

      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Kuis Video</h1>
              <p>Semua jawaban harus benar untuk melanjutkan.</p>
            </div>

            <form id="quizForm">
              ${questionHtml}

              <div id="quizResult" class="message"></div>

              <button type="submit">Kirim Jawaban</button>

              <button class="logout" type="button" onclick="openModule('${escapeHtml(moduleId)}')">
                Kembali ke Video
              </button>
            </form>
          </section>
        </main>
      `;

      document.getElementById('quizForm').addEventListener('submit', event => {
        submitQuiz(event, moduleId, videoId, questions);
      });
    }

    async function submitQuiz(event, moduleId, videoId, questions) {
      event.preventDefault();

      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const resultBox = document.getElementById('quizResult');
      const answers = Object.fromEntries(new FormData(form).entries());

      button.disabled = true;
      button.textContent = 'Memeriksa jawaban...';

      try {
        const result = await api('submitQuiz', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId,
          answers: JSON.stringify(answers)
        });

        if (result.lulus) {

          /*
           * Quiz berhasil.
           * Hapus state lokal video karena
           * video + quiz sudah benar-benar selesai.
           */
          try {
            localStorage.removeItem(
              getWatchKey(videoId)
            );
          } catch (error) {}
        
        
          /*
           * Update state lokal agar langsung konsisten.
           */
          const completedIndex =
            activeVideos.findIndex(
              item =>
                String(item.video_id) ===
                String(videoId)
            );
        
          if (completedIndex !== -1) {
        
            activeVideos[
              completedIndex
            ].selesai = true;
        
            activeVideos[
              completedIndex
            ]._videoSelesai = true;
          }
        
        
          /*
           * Tampilkan loading supaya mahasiswa
           * tahu sistem sedang memproses modul.
           */
          showLoading(
            'Quiz benar. Memeriksa penyelesaian modul...'
          );
        
        
          /*
           * Kembali ke Dashboard.
           *
           * Dashboard akan mengambil ulang data
           * progress dari server dan mendeteksi
           * apakah seluruh video modul sudah selesai.
           */
          await renderDashboard();
        
          return;
        }

        const salah = result.results
          .filter(item => !item.benar)
          .map(item => {
            const question = questions.find(
              question => question.question_id === item.question_id
            );

            const textJawabanBenar = question[
              `opsi_${item.jawaban_benar.toLowerCase()}`
            ];

            const nomorSoal = questions.findIndex(
              question => question.question_id === item.question_id
            ) + 1;

            const jawabanMahasiswa = String(
              answers[item.question_id] || '-'
            ).toUpperCase();

            const textJawabanMahasiswa = question[
              `opsi_${jawabanMahasiswa.toLowerCase()}`
            ] || '-';

            return `
              <li style="margin-bottom:10px;">
                <b>Soal ${nomorSoal}</b><br>
                Jawaban Anda:
                <b style="color:#b91c1c;">
                  ${escapeHtml(jawabanMahasiswa)}.
                  ${escapeHtml(textJawabanMahasiswa)}
                </b><br>
                Jawaban benar:
                <b style="color:#006747;">
                  ${item.jawaban_benar}.
                  ${escapeHtml(textJawabanBenar)}
                </b>
              </li>
            `;
          }).join('');

        resultBox.className = 'message error';
        resultBox.innerHTML = `
          <b>Masih ada jawaban yang salah.</b>
          <ul style="margin:8px 0 0; padding-left:20px;">${salah}</ul>
          <p style="margin:10px 0 0;">Perbaiki jawaban Anda, lalu kirim kembali.</p>
        `;

        button.disabled = false;
        button.textContent = 'Kirim Jawaban';
      } catch (error) {
        resultBox.className = 'message error';
        resultBox.textContent = error.message;
        button.disabled = false;
        button.textContent = 'Kirim Jawaban';
      }
    }

    function fileToBase64_(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
    
        reader.onload = () => {
          const result = reader.result;
    
          // Ambil hanya bagian Base64, tanpa data:mime...
          const base64 = result.split(',')[1];
    
          resolve(base64);
        };
    
        reader.onerror = () => {
          reject(new Error('Gagal membaca file.'));
        };
    
        reader.readAsDataURL(file);
      });
    }
    
    async function uploadDocument(
      jenisDokumen,
      namaDokumen,
      inputId
    ) {
      const input = document.getElementById(inputId);
    
      if (!input || !input.files.length) {
        alert('Silakan pilih file terlebih dahulu.');
        return;
      }
    
      const file = input.files[0];
    
      if (file.size > 1024 * 1024) {
        alert('Ukuran file maksimal 1 MB.');
        return;
      }
    
      const allowedTypes = [
        'image/jpeg',
        'image/png',
        'application/pdf'
      ];
    
      if (!allowedTypes.includes(file.type)) {
        alert('Format file harus JPG, JPEG, PNG, atau PDF.');
        return;
      }
    
      try {
        showLoading('Mengunggah dokumen...');
    
        const fileData = await fileToBase64_(file);
    
        const result = await api('uploadDocument', {
          token: sessionToken,
          jenisDokumen: jenisDokumen,
          namaDokumen: namaDokumen || '',
          fileName: file.name,
          mimeType: file.type,
          fileData: fileData
        });
    
        alert(`Berhasil mengunggah:\n${result.nama_file}`);
    
        renderDashboard();
    
      } catch (error) {
        alert(error.message);
        renderDashboard();
      }
    }

    async function showModuleDocuments(moduleId) {

        );

      }
    }

                    </span>
    
                  </div>
    
    
                  ${
                    doc
                      ? `
                        <small>
                          ${escapeHtml(

              <input

    async function uploadModuleDocument(
      moduleId,
      jenisDokumen,
      namaDokumen,
      input
    ) {
      const file = input.files && input.files[0];
    
      if (!file) return;
    
      // Maksimal 1 MB
      if (file.size > 1024 * 1024) {
        alert('Ukuran file maksimal 1 MB.');
        input.value = '';
        return;
      }
    
      const allowedTypes = [
        'image/jpeg',
        'image/png',
        'application/pdf'
      ];
    
      if (!allowedTypes.includes(file.type)) {
        alert('Format file harus JPG, PNG, atau PDF.');
        input.value = '';
        return;
      }
    
      try {
        // Baca file menjadi Base64
        const fileData = await fileToBase64_(file);
    
        const uploadId =
          Date.now().toString(36) +
          '_' +
          Math.random().toString(36).substring(2, 10);
    
        // 25.000 karakter Base64 per request
        const CHUNK_SIZE = 25000;
    
        const totalChunks = Math.ceil(
          fileData.length / CHUNK_SIZE
        );
    
        showLoading('Mengunggah berkas...');
    
        // Kirim chunk secara bertahap
        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const end = Math.min(
            start + CHUNK_SIZE,
            fileData.length
          );
    
          const chunk = fileData.substring(start, end);
    
          await api('uploadDocumentChunk', {
            token,
            uploadId,
            chunkIndex: i,
            totalChunks,
            chunk
          });
    
          const persen = Math.round(
            ((i + 1) / totalChunks) * 100
          );
    
          const loadingText =
            document.querySelector('#loadingText');
    
          if (loadingText) {
            loadingText.textContent =
              `Mengunggah berkas... ${persen}%`;
          }
        }
    
        // Gabungkan seluruh chunk di server
        const result = await api(
          'finishDocumentUpload',
          {
            token,
            uploadId,
            totalChunks,
            moduleId,
            jenisDokumen,
            namaDokumen,
            fileName: file.name,
            mimeType: file.type
          }
        );
    
        alert(
          result.message ||
          'Berkas berhasil diunggah.'
        );
    
        input.value = '';
    
        await showModuleDocuments(moduleId);
    
      } catch (err) {
        console.error(err);
    
        alert(
          err.message ||
          'Gagal mengunggah berkas.'
        );
    
        input.value = '';
      }
    }

    function renderOtherDocuments(documents) {
      const container = document.getElementById('otherDocuments');
    
      if (!container) return;
    
      const others = documents.filter(
        doc => doc.jenis_dokumen === 'Dokumen Lainnya'
      );
    
      if (!others.length) {
        container.innerHTML = '';
        return;
      }
    
      container.innerHTML = `
        <div class="other-document-list">
          <strong>Dokumen tambahan:</strong>
    
          ${others.map(doc => `
            <div class="other-document-row">
              <span>
                ✓ ${escapeHtml(doc.nama_file)}
              </span>
            </div>
          `).join('')}
        </div>
      `;
    }
    
    function toEmbedUrl(url) {
      const value = String(url || '').trim();
    
      // Google Drive
      const driveMatch =
        value.match(/\/d\/([^/]+)/) ||
        value.match(/[?&]id=([^&]+)/);
    
      if (value.includes('drive.google.com') && driveMatch) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }
    
      // YouTube Shorts
      const shortsMatch = value.match(
        /youtube\.com\/shorts\/([^?&/]+)/
      );
    
      if (shortsMatch) {
        return `https://www.youtube.com/embed/${shortsMatch[1]}`;
      }
    
      // YouTube biasa
      const youtubeMatch = value.match(
        /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^?&/]+)/
      );
    
      if (youtubeMatch) {
        return `https://www.youtube.com/embed/${youtubeMatch[1]}`;
      }
    
      return value;
    }
    
    function showDeclaration(moduleId) {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Finalisasi Modul</h1>
              <p>Pastikan Anda sudah memahami seluruh panduan pada modul ini.</p>
            </div>
    
            <form id="declarationForm">
              <article class="module">
                <p style="line-height:1.6;">
                  Saya menyatakan telah mengikuti seluruh panduan dan memahami
                  informasi pada modul ini.
                </p>
    
                <label style="font-weight:normal;display:flex;gap:10px;align-items:flex-start;">
                  <input id="acceptDeclaration" type="checkbox"
                    style="width:auto;margin-top:3px;">
                  <span>Saya setuju dengan pernyataan di atas.</span>
                </label>
              </article>
    
              <button type="submit">Setujui dan Finalisasi</button>
              <button class="logout" type="button" onclick="renderDashboard()">
                Kembali
              </button>
    
              <div id="declarationMessage" class="message"></div>
            </form>
          </section>
        </main>
      `;
    
      document.getElementById('declarationForm').addEventListener('submit', event => {
        submitDeclaration(event, moduleId);
      });
    }
    
    async function submitDeclaration(event, moduleId) {
      event.preventDefault();
    
      const accepted = document.getElementById('acceptDeclaration').checked;
      const message = document.getElementById('declarationMessage');
    
      if (!accepted) {
        message.className = 'message error';
        message.textContent = 'Centang persetujuan pernyataan terlebih dahulu.';
        return;
      }
    
      showLoading('Menyimpan finalisasi...');
    
      try {
        await api('declare', {
          token: sessionToken,
          moduleId: moduleId,
          accepted: true
        });
    
        renderDashboard();
      } catch (error) {
        alert(error.message);
        showDeclaration(moduleId);
      }
    }

    function logout() {
      localStorage.removeItem('portalUser');
      localStorage.removeItem('portalToken');

      currentUser = null;
      sessionToken = null;

      renderLogin();
    }

    if (currentUser && sessionToken) {
      if (String(currentUser.role).toLowerCase() === 'admin') {
        renderAdminDashboard();
      } else {
        renderDashboard();
      }
    } else {
      renderLogin();
    }
  </script>
