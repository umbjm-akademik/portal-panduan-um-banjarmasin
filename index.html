<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Panduan UM Banjarmasin</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>

<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById('app');
    let currentUser = JSON.parse(localStorage.getItem('portalUser') || 'null');
    let sessionToken = localStorage.getItem('portalToken');
    let activeModuleId = null;
    let activeVideos = [];
    let watchTimers = [];

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function showLoading(message) {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="loading">
              <div class="spinner"></div>
              <span>${escapeHtml(message)}</span>
            </div>
          </section>
        </main>
      `;
    }

    function api(action, params = {}) {
      return new Promise((resolve, reject) => {
        if (!window.PORTAL_CONFIG || !PORTAL_CONFIG.API_URL) {
          reject(new Error('Alamat API belum diatur pada config.js.'));
          return;
        }

        const callback = `portalCallback_${Date.now()}_${Math.random()
          .toString(36).slice(2)}`;

        const query = new URLSearchParams({
          action,
          callback,
          ...params
        });

        const script = document.createElement('script');

        window[callback] = response => {
          delete window[callback];
          script.remove();

          if (response.success) resolve(response.data);
          else reject(new Error(response.message || 'Permintaan gagal.'));
        };

        script.onerror = () => {
          delete window[callback];
          script.remove();
          reject(new Error('Koneksi ke server gagal.'));
        };

        script.src = `${PORTAL_CONFIG.API_URL}?${query.toString()}`;
        document.head.appendChild(script);
      });
    }

    function renderLogin() {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Portal Panduan UM Banjarmasin</h1>
              <p>Masuk untuk mengakses panduan dan menyelesaikan proses akademik Anda.</p>
            </div>

            <form id="loginForm">
              <label for="loginId">NIM atau Username</label>
              <input id="loginId" type="text" required autocomplete="username">

              <label for="tanggalLahir">Tanggal Lahir</label>
              <input id="tanggalLahir" type="date" required>

              <button id="loginButton" type="submit">Masuk</button>
              <div id="message" class="message" role="alert"></div>
            </form>
          </section>
        </main>
      `;

      document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();

        const button = document.getElementById('loginButton');
        const message = document.getElementById('message');
        button.disabled = true;
        button.textContent = 'Memeriksa data...';
        message.className = 'message';

        try {
          const result = await api('login', {
            loginId: document.getElementById('loginId').value.trim(),
            tanggalLahir: document.getElementById('tanggalLahir').value
          });

          currentUser = result.user;
          sessionToken = result.token;
          localStorage.setItem('portalUser', JSON.stringify(currentUser));
          localStorage.setItem('portalToken', sessionToken);

          renderDashboard();
        } catch (error) {
          message.className = 'message error';
          message.textContent = error.message;
          button.disabled = false;
          button.textContent = 'Masuk';
        }
      });
    }

    async function renderDashboard() {
      showLoading('Memuat portal...');

      try {
        const result = await api('modules', { token: sessionToken });
        const modules = result.modules || [];

        const daftarModul = modules.length
          ? modules.map(module => {
              const progress = `${module.video_selesai || 0} dari ${module.total_video || 0} video selesai`;
        
              let action;
        
              if (module.deklarasi_disetujui) {
                action = `
                  <p style="color:#006747;font-weight:bold;margin-top:16px;">
                    ✓ Modul telah difinalisasi
                  </p>
                `;
              } else if (module.selesai) {
                action = `
                  <button type="button"
                    onclick="showDeclaration('${escapeHtml(module.module_id)}')">
                    Finalisasi Modul
                  </button>
                `;
              } else {
                action = `
                  <button type="button"
                    onclick="openModule('${escapeHtml(module.module_id)}')">
                    Buka Modul
                  </button>
                `;
              }
        
              return `
                <article class="module">
                  <h2>${escapeHtml(module.nama_modul)}</h2>
                  <p>${escapeHtml(module.deskripsi)}</p>
                  <p style="font-size:13px;color:#64748b;margin:12px 0 0;">
                    Progress: ${progress}
                  </p>
                  ${action}
                </article>
              `;
            }).join('')
          : '<p class="empty">Belum ada modul yang tersedia untuk akun Anda.</p>';
        
        app.innerHTML = `
          <main class="container">
            <section class="card">
              <div class="brand">
                <h1>Halo, ${escapeHtml(currentUser.nama)}</h1>
                <p>${escapeHtml(currentUser.prodi || 'Mahasiswa')} · Pilih panduan yang perlu Anda selesaikan.</p>
              </div>

              ${daftarModul}

              <button class="logout" type="button" onclick="logout()">Keluar</button>
            </section>
          </main>
        `;
      } catch (error) {
        logout();
      }
    }

    async function openModule(moduleId) {
      showLoading('Memuat video...');

      try {
        const result = await api('videos', {
          token: sessionToken,
          moduleId: moduleId
        });

        renderModule(moduleId, result.videos || []);
      } catch (error) {
        alert(error.message);
        renderDashboard();
      }
    }

    function renderModule(moduleId, videos) {
      activeModuleId = moduleId;
      activeVideos = videos;

      watchTimers.forEach(timer => clearInterval(timer));
      watchTimers = [];

      const daftarVideo = videos.length
        ? videos.map((video, index) => {
            const terbuka = index === 0 || videos[index - 1].selesai;

            if (!terbuka) {
              return `
                <article class="module">
                  <h2>${index + 1}. ${escapeHtml(video.judul)}</h2>
                  <p>Video ini akan terbuka setelah video sebelumnya diselesaikan.</p>
                </article>
              `;
            }

            const status = video.selesai
              ? '<p style="color:#006747;font-weight:bold;margin-top:12px;">✓ Video dan kuis telah diselesaikan</p>'
              : `<div id="watch-status-${escapeHtml(video.video_id)}"></div>`;

            return `
              <article class="module">
                <h2>${index + 1}. ${escapeHtml(video.judul)}</h2>

                <iframe
                  src="${escapeHtml(toEmbedUrl(video.url_video))}"
                  title="${escapeHtml(video.judul)}"
                  style="width:100%; aspect-ratio:16/9; border:0; border-radius:10px; margin-top:14px;"
                  allow="autoplay; fullscreen"
                  allowfullscreen>
                </iframe>

                ${status}
              </article>
            `;
          }).join('')
        : '<p class="empty">Belum ada video pada modul ini.</p>';

      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Materi Video</h1>
              <p>Selesaikan video secara berurutan.</p>
            </div>

            ${daftarVideo}

            <button class="logout" type="button" onclick="renderDashboard()">
              Kembali ke Daftar Modul
            </button>
          </section>
        </main>
      `;

      initializeWatchTimers();
    }

    function watchKey(videoId) {
      return `portalWatch_${currentUser.user_id}_${videoId}`;
    }

    function getWatchState(videoId) {
      return JSON.parse(
        localStorage.getItem(watchKey(videoId)) ||
        '{"seconds":0,"running":false}'
      );
    }

    function saveWatchState(videoId, state) {
      localStorage.setItem(watchKey(videoId), JSON.stringify(state));
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;

      return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    function watchStatusHtml(video) {
      const duration = Math.max(Number(video.durasi_detik || 0), 1);
      const state = getWatchState(video.video_id);
      const watched = Math.min(Number(state.seconds || 0), duration);
      const remaining = Math.max(duration - watched, 0);

      if (remaining === 0) {
        return `
          <p style="color:#006747;font-weight:bold;margin-top:14px;">
            ✓ Durasi video telah terpenuhi
          </p>
          <button type="button"
            onclick="openQuiz('${escapeHtml(activeModuleId)}', '${escapeHtml(video.video_id)}')">
            Lanjut ke Kuis
          </button>
        `;
      }

      if (!state.running) {
        return `
          <p style="color:#64748b;margin-top:14px;">
            Tonton video hingga waktu minimum terpenuhi: ${formatTime(duration)}.
          </p>
          <button type="button" onclick="startWatching('${escapeHtml(video.video_id)}')">
            Mulai Menonton
          </button>
        `;
      }

      return `
        <p style="color:#006747;font-weight:bold;margin-top:14px;">
          Sedang mencatat waktu menonton: ${formatTime(watched)} / ${formatTime(duration)}
        </p>
        <p style="color:#64748b;font-size:13px;">
          Jangan pindah tab atau tutup halaman selama menonton.
        </p>
      `;
    }

    function updateWatchStatus(video) {
      const element = document.getElementById(`watch-status-${video.video_id}`);

      if (element) {
        element.innerHTML = watchStatusHtml(video);
      }
    }

    function startWatching(videoId) {
      const state = getWatchState(videoId);
      state.running = true;
      saveWatchState(videoId, state);

      initializeWatchTimers();
    }

    function initializeWatchTimers() {
      watchTimers.forEach(timer => clearInterval(timer));
      watchTimers = [];

      activeVideos
        .filter(video => !video.selesai)
        .forEach(video => {
          updateWatchStatus(video);

          const state = getWatchState(video.video_id);
          if (!state.running) return;

          const timer = setInterval(() => {
            const current = getWatchState(video.video_id);

            if (!current.running || document.hidden) return;

            const duration = Math.max(Number(video.durasi_detik || 0), 1);
            current.seconds = Math.min(Number(current.seconds || 0) + 1, duration);

            if (current.seconds >= duration) {
              current.running = false;
            }

            saveWatchState(video.video_id, current);
            updateWatchStatus(video);

            if (!current.running) {
              clearInterval(timer);
            }
          }, 1000);

          watchTimers.push(timer);
        });
    }

    async function openQuiz(moduleId, videoId) {
      showLoading('Menyiapkan kuis...');

      try {
        const result = await api('quiz', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId
        });

        const questions = result.questions || [];

        if (!questions.length) {
          await completeVideo(moduleId, videoId);
          return;
        }

        renderQuiz(moduleId, videoId, questions);
      } catch (error) {
        alert(error.message);
        openModule(moduleId);
      }
    }

    function renderQuiz(moduleId, videoId, questions) {
      const questionHtml = questions.map((question, index) => `
        <article class="module">
          <h2>Soal ${index + 1}</h2>
          <p style="font-weight:bold; color:#1c2d26;">
            ${escapeHtml(question.pertanyaan)}
          </p>

          ${['A', 'B', 'C', 'D'].map(option => `
            <label style="font-weight:normal; display:flex; gap:10px; align-items:flex-start; margin:13px 0;">
              <input type="radio" required
                name="${escapeHtml(question.question_id)}"
                value="${option}"
                style="width:auto; margin-top:2px;">
              <span>${option}. ${escapeHtml(question[`opsi_${option.toLowerCase()}`])}</span>
            </label>
          `).join('')}
        </article>
      `).join('');

      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Kuis Video</h1>
              <p>Semua jawaban harus benar untuk melanjutkan.</p>
            </div>

            <form id="quizForm">
              ${questionHtml}

              <div id="quizResult" class="message"></div>

              <button type="submit">Kirim Jawaban</button>

              <button class="logout" type="button" onclick="openModule('${escapeHtml(moduleId)}')">
                Kembali ke Video
              </button>
            </form>
          </section>
        </main>
      `;

      document.getElementById('quizForm').addEventListener('submit', event => {
        submitQuiz(event, moduleId, videoId, questions);
      });
    }

    async function submitQuiz(event, moduleId, videoId, questions) {
      event.preventDefault();

      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const resultBox = document.getElementById('quizResult');
      const answers = Object.fromEntries(new FormData(form).entries());

      button.disabled = true;
      button.textContent = 'Memeriksa jawaban...';

      try {
        const result = await api('submitQuiz', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId,
          answers: JSON.stringify(answers)
        });

        if (result.lulus) {
          openModule(moduleId);
          return;
        }

        const salah = result.results
          .filter(item => !item.benar)
          .map(item => {
            const question = questions.find(
              question => question.question_id === item.question_id
            );

            const textJawabanBenar = question[
              `opsi_${item.jawaban_benar.toLowerCase()}`
            ];

            const nomorSoal = questions.findIndex(
              question => question.question_id === item.question_id
            ) + 1;

            const jawabanMahasiswa = String(
              answers[item.question_id] || '-'
            ).toUpperCase();

            const textJawabanMahasiswa = question[
              `opsi_${jawabanMahasiswa.toLowerCase()}`
            ] || '-';

            return `
              <li style="margin-bottom:10px;">
                <b>Soal ${nomorSoal}</b><br>
                Jawaban Anda:
                <b style="color:#b91c1c;">
                  ${escapeHtml(jawabanMahasiswa)}.
                  ${escapeHtml(textJawabanMahasiswa)}
                </b><br>
                Jawaban benar:
                <b style="color:#006747;">
                  ${item.jawaban_benar}.
                  ${escapeHtml(textJawabanBenar)}
                </b>
              </li>
            `;
          }).join('');

        resultBox.className = 'message error';
        resultBox.innerHTML = `
          <b>Masih ada jawaban yang salah.</b>
          <ul style="margin:8px 0 0; padding-left:20px;">${salah}</ul>
          <p style="margin:10px 0 0;">Perbaiki jawaban Anda, lalu kirim kembali.</p>
        `;

        button.disabled = false;
        button.textContent = 'Kirim Jawaban';
      } catch (error) {
        resultBox.className = 'message error';
        resultBox.textContent = error.message;
        button.disabled = false;
        button.textContent = 'Kirim Jawaban';
      }
    }

    async function completeVideo(moduleId, videoId) {
      try {
        await api('completeVideo', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId
        });

        openModule(moduleId);
      } catch (error) {
        alert(error.message);
      }
    }

    function toEmbedUrl(url) {
      const value = String(url || '');
      const driveMatch = value.match(/\/d\/([^/]+)/) || value.match(/[?&]id=([^&]+)/);

      if (value.includes('drive.google.com') && driveMatch) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }

      return value;
    }

    function showDeclaration(moduleId) {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Finalisasi Modul</h1>
              <p>Pastikan Anda sudah memahami seluruh panduan pada modul ini.</p>
            </div>
    
            <form id="declarationForm">
              <article class="module">
                <p style="line-height:1.6;">
                  Saya menyatakan telah mengikuti seluruh panduan dan memahami
                  informasi pada modul ini.
                </p>
    
                <label style="font-weight:normal;display:flex;gap:10px;align-items:flex-start;">
                  <input id="acceptDeclaration" type="checkbox"
                    style="width:auto;margin-top:3px;">
                  <span>Saya setuju dengan pernyataan di atas.</span>
                </label>
              </article>
    
              <button type="submit">Setujui dan Finalisasi</button>
              <button class="logout" type="button" onclick="renderDashboard()">
                Kembali
              </button>
    
              <div id="declarationMessage" class="message"></div>
            </form>
          </section>
        </main>
      `;
    
      document.getElementById('declarationForm').addEventListener('submit', event => {
        submitDeclaration(event, moduleId);
      });
    }
    
    async function submitDeclaration(event, moduleId) {
      event.preventDefault();
    
      const accepted = document.getElementById('acceptDeclaration').checked;
      const message = document.getElementById('declarationMessage');
    
      if (!accepted) {
        message.className = 'message error';
        message.textContent = 'Centang persetujuan pernyataan terlebih dahulu.';
        return;
      }
    
      showLoading('Menyimpan finalisasi...');
    
      try {
        await api('declare', {
          token: sessionToken,
          moduleId: moduleId,
          accepted: true
        });
    
        renderDashboard();
      } catch (error) {
        alert(error.message);
        showDeclaration(moduleId);
      }
    }

    function logout() {
      localStorage.removeItem('portalUser');
      localStorage.removeItem('portalToken');

      currentUser = null;
      sessionToken = null;

      renderLogin();
    }

    if (currentUser && sessionToken) {
      renderDashboard();
    } else {
      renderLogin();
    }
  </script>
</body>
</html>
