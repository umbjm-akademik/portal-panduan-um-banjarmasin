<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Panduan UM Banjarmasin</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById('app');
    let currentUser = JSON.parse(localStorage.getItem('portalUser') || 'null');
    let sessionToken = localStorage.getItem('portalToken');
    let activeModuleId = null;
    let activeVideos = [];
    let youtubePlayers = {};
    let watchStates = {};
    let watchSaveTimers = {};
    let playerReady = false;

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function showLoading(message) {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="loading">
              <div class="spinner"></div>
              <span>${escapeHtml(message)}</span>
            </div>
          </section>
        </main>
      `;
    }

    function api(action, params = {}) {
      return new Promise((resolve, reject) => {
        if (!window.PORTAL_CONFIG || !PORTAL_CONFIG.API_URL) {
          reject(new Error('Alamat API belum diatur pada config.js.'));
          return;
        }

        const callback = `portalCallback_${Date.now()}_${Math.random()
          .toString(36).slice(2)}`;

        const query = new URLSearchParams({
          action,
          callback,
          ...params
        });

        const script = document.createElement('script');

        window[callback] = response => {
          delete window[callback];
          script.remove();

          if (response.success) resolve(response.data);
          else reject(new Error(response.message || 'Permintaan gagal.'));
        };

        script.onerror = () => {
          delete window[callback];
          script.remove();
          reject(new Error('Koneksi ke server gagal.'));
        };

        script.src = `${PORTAL_CONFIG.API_URL}?${query.toString()}`;
        document.head.appendChild(script);
      });
    }

    function setupTanggalLahir() {
      const dateInput = document.getElementById('tanggalLahir');
      const displayInput = document.getElementById('tanggalLahirDisplay');
    
      if (!dateInput || !displayInput) return;
    
      displayInput.addEventListener('click', function () {
        if (typeof dateInput.showPicker === 'function') {
          dateInput.showPicker();
        } else {
          dateInput.click();
        }
      });
    
      dateInput.addEventListener('change', function () {
        if (!this.value) {
          displayInput.value = '';
          return;
        }
    
        const [year, month, day] = this.value.split('-');
    
        displayInput.value = `${day}/${month}/${year}`;
      });
    }
    
    function renderLogin() {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <img
                src="Logo.webp"
                alt="Universitas Muhammadiyah Banjarmasin"
                class="portal-logo"
              >
            
              <h1>Portal Panduan UM Banjarmasin</h1>
            
              <p>
                Masuk untuk mengakses panduan dan menyelesaikan proses akademik Anda.
              </p>
            </div>

            <form id="loginForm">
              <label for="loginId">NIM atau Username</label>
              <input id="loginId" type="text" required autocomplete="username">

              <label for="tanggalLahirDisplay">Tanggal Lahir</label>

              <input
                id="tanggalLahirDisplay"
                type="text"
                placeholder="DD/MM/YYYY"
                readonly
              >
              
              <input
                id="tanggalLahir"
                type="date"
                style="position:absolute; opacity:0; width:1px; height:1px;"
              >

              <button id="loginButton" type="submit">Masuk</button>
              <div id="message" class="message" role="alert"></div>
            </form>
          </section>
        </main>
      `;

      document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault();

        const button = document.getElementById('loginButton');
        const message = document.getElementById('message');
        button.disabled = true;
        button.textContent = 'Memeriksa data...';
        message.className = 'message';

        try {
          const result = await api('login', {
            loginId: document.getElementById('loginId').value.trim(),
            tanggalLahir: document.getElementById('tanggalLahir').value
          });

          currentUser = result.user;
          sessionToken = result.token;
          localStorage.setItem('portalUser', JSON.stringify(currentUser));
          localStorage.setItem('portalToken', sessionToken);
                   
          if (String(currentUser.role).toLowerCase() === 'admin') {
            renderAdminDashboard();
          } else {
            renderDashboard();
          }
        } 
        catch (error) {
          message.className = 'message error';
          message.textContent = error.message;
          button.disabled = false;
          button.textContent = 'Masuk';
        }
      });
      setupTanggalLahir();
    }

    async function renderDashboard() {
      showLoading('Memuat portal...');

      try {
        const result = await api('modules', { token: sessionToken });
        const modules = result.modules || [];

        const daftarModul = modules.length
          ? modules.map(module => {
              const progress = `${module.video_selesai || 0} dari ${module.total_video || 0} video selesai`;
        
              let action;
        
              if (module.deklarasi_disetujui) {
                action = `
                  <p style="color:#006747;font-weight:bold;margin-top:16px;">
                    ✓ Modul telah difinalisasi
                  </p>
                `;
              } else if (module.selesai) {
                action = `
                  <button type="button"
                    onclick="showDeclaration('${escapeHtml(module.module_id)}')">
                    Finalisasi Modul
                  </button>
                `;
              } else {
                action = `
                  <button type="button"
                    onclick="openModule('${escapeHtml(module.module_id)}')">
                    Buka Modul
                  </button>
                `;
              }
        
              return `
                <article class="module">
                  <h2>${escapeHtml(module.nama_modul)}</h2>
                  <p>${escapeHtml(module.deskripsi)}</p>
                  <p style="font-size:13px;color:#64748b;margin:12px 0 0;">
                    Progress: ${progress}
                  </p>
                  ${action}
                </article>
              `;
            }).join('')
          : '<p class="empty">Belum ada modul yang tersedia untuk akun Anda.</p>';
        
        app.innerHTML = `
          <main class="container">
            <section class="card">
              <div class="brand">
                <img
                  src="Logo.webp"
                  alt="Universitas Muhammadiyah Banjarmasin"
                  class="portal-logo"
                >
                <h1>Halo, ${escapeHtml(currentUser.nama)}</h1>
                <p>Nomor Induk Mahasiswa (NIM): ${escapeHtml(currentUser.nim || 'Mahasiswa')}</p>
                <p>Program Studi: ${escapeHtml(currentUser.prodi || 'Mahasiswa')}</p>
                <br></br>
                <p>Pilih panduan yang perlu Anda selesaikan.</p>
              </div>

              ${daftarModul}

              <section class="module documents-section">
                <h2>📎 Dokumen Persyaratan</h2>
              
                <p class="document-info">
                  Unggah dokumen sesuai petunjuk. Format yang diterima:
                  JPG, JPEG, PNG, atau PDF. Maksimal 1 MB per dokumen.
                </p>
              
                <div id="documentList">
                  <p class="loading-text">Memuat status dokumen...</p>
                </div>
              </section>
              
              <button class="logout" type="button" onclick="logout()">Keluar</button>
            </section>
          </main>
        `;
        renderDocuments();
      } catch (error) {
        logout();
      }
    }

    async function renderAdminDashboard() {
      showLoading('Memuat dashboard admin...');
    
      try {
        const result = await api('adminDashboard', {
          token: sessionToken
        });
    
        const mahasiswa = result.mahasiswa || [];
    
        const daftarMahasiswa = mahasiswa.length
          ? mahasiswa.map(user => `
              <article class="module">
                <h2>${escapeHtml(user.nama)}</h2>
                <p>${escapeHtml(user.nim)} · ${escapeHtml(user.prodi)}</p>
                <p style="font-size:13px;color:#64748b;margin:12px 0 0;">
                  Modul selesai: ${user.modul_selesai} dari ${user.total_modul}<br>
                  Finalisasi: ${user.finalisasi} dari ${user.total_modul}
                </p>
              </article>
            `).join('')
          : '<p class="empty">Belum ada mahasiswa aktif.</p>';
    
        app.innerHTML = `
          <main class="container">
            <section class="card">
              <div class="brand">
                <h1>Dashboard Admin</h1>
                <p>Ringkasan penyelesaian panduan mahasiswa.</p>
              </div>
    
              <article class="module">
                <h2>Total Mahasiswa</h2>
                <p style="font-size:30px;font-weight:bold;color:#006747;margin:8px 0;">
                  ${result.total_mahasiswa || 0}
                </p>
              </article>
    
              ${daftarMahasiswa}
    
              <button type="button" onclick="renderAdminDashboard()">
                Muat Ulang Data
              </button>
    
              <button class="logout" type="button" onclick="logout()">
                Keluar
              </button>
            </section>
          </main>
        `;
      } catch (error) {
        alert(error.message);
        logout();
      }
    }
    
    async function openModule(moduleId) {
      showLoading('Memuat video...');

      try {
        const result = await api('videos', {
          token: sessionToken,
          moduleId: moduleId
        });

        renderModule(moduleId, result.videos || []);
      } catch (error) {
        alert(error.message);
        renderDashboard();
      }
    }

    function watchAgain(videoId) {
      const player =
        youtubePlayers[videoId];
    
      if (!player) return;
    
      player.seekTo(0, true);
      player.playVideo();
    }

    function renderModule(moduleId, videos) {
      activeModuleId = moduleId;
      activeVideos = videos;
      // Server/Spreadsheet menjadi sumber status resmi.
      // Progress lokal yang tersisa hanya dipakai untuk sesi aktif.
      videos.forEach(video => {
        if (video.selesai) {
          delete watchStates[video.video_id];
        }
      });
      watchTimers.forEach(timer => clearInterval(timer));
      watchTimers = [];

      const daftarVideo = videos.length
        ? videos.map((video, index) => {
            const terbuka = index === 0 || videos[index - 1].selesai;

            if (!terbuka) {
              return `
                <article class="module ${video.selesai ? 'video-completed' : ''}">
                  <h2>${index + 1}. ${escapeHtml(video.judul)}</h2>
                  <p>Video ini akan terbuka setelah video sebelumnya diselesaikan.</p>
                </article>
              `;
            }

            const status = video.selesai
              ? `
                <div class="video-completed-status">
                  ✓ Video dan kuis telah diselesaikan
                </div>
            
                <button
                  type="button"
                  class="watch-again-button"
                  onclick="watchAgain('${escapeHtml(video.video_id)}')">
                  Tonton Kembali
                </button>
              `
              : `
                <div id="watch-status-${escapeHtml(video.video_id)}"></div>
              `;

            return `
              <article class="module">
                <h2>${index + 1}. ${escapeHtml(video.judul)}</h2>
              
                <div
                  class="video-wrapper ${video.orientasi === 'vertical' ? 'video-vertical' : 'video-horizontal'}"
                  id="video-wrapper-${escapeHtml(video.video_id)}">
                
                  <div
                    id="youtube-player-${escapeHtml(video.video_id)}"
                    class="video-frame">
                  </div>
                
                  ${!video.selesai ? `
                    <div
                      id="video-lock-${escapeHtml(video.video_id)}"
                      class="video-lock"
                      onclick="startWatching('${escapeHtml(video.video_id)}')">
                
                      <div class="video-lock-content">
                        <div class="play-icon">▶</div>
                        <strong>Mulai Menonton</strong>
                        <span>Klik untuk memulai video</span>
                      </div>
                
                    </div>
                  ` : ''}
                
                </div>
              
                ${status}
              </article>
            `;
          }).join('')
        : '<p class="empty">Belum ada video pada modul ini.</p>';

      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <img
                  src="Logo.webp"
                  alt="Universitas Muhammadiyah Banjarmasin"
                  class="portal-logo"
              >
              <h1>Materi Video</h1>
              <p>Selesaikan video secara berurutan.</p>
            </div>

            ${daftarVideo}

            <button class="logout" type="button" onclick="renderDashboard()">
              Kembali ke Daftar Modul
            </button>
          </section>
        </main>
      `;

      setTimeout(() => {

        if (
          typeof YT === 'undefined' ||
          !YT.Player
        ) {
          return;
        }
      
        youtubePlayers = {};
        watchSaveTimers = {};
      
        activeVideos
          .filter(video => {
            const index =
              activeVideos.findIndex(
                item =>
                  item.video_id ===
                  video.video_id
              );
      
            return (
              index === 0 ||
              activeVideos[index - 1].selesai ||
              video.selesai
            );
          })
          .forEach(video => {
            createYouTubePlayer(video);
          });
      
      }, 300);
    }

    function extractYouTubeId(url) {
      const value = String(url || '').trim();
    
      const shorts = value.match(
        /youtube\.com\/shorts\/([^?&/]+)/
      );
    
      if (shorts) {
        return shorts[1];
      }
    
      const watch = value.match(
        /youtube\.com\/watch\?v=([^?&/]+)/
      );
    
      if (watch) {
        return watch[1];
      }
    
      const shortUrl = value.match(
        /youtu\.be\/([^?&/]+)/
      );
    
      if (shortUrl) {
        return shortUrl[1];
      }
    
      const embed = value.match(
        /youtube\.com\/embed\/([^?&/]+)/
      );
    
      if (embed) {
        return embed[1];
      }
    
      return '';
    }

    function getWatchKey(videoId) {
      if (!currentUser || !currentUser.user_id) return '';
    
      return `portalWatch_${currentUser.user_id}_${videoId}`;
    }

    function getWatchState(videoId) {
      const key = getWatchKey(videoId);
    
      if (!key) {
        return {
          position: 0,
          maxWatched: 0
        };
      }
    
      try {
        const saved = JSON.parse(
          localStorage.getItem(key) || '{}'
        );
    
        return {
          position: Number(saved.position || 0),
          maxWatched: Number(saved.maxWatched || 0)
        };
      } catch (error) {
        return {
          position: 0,
          maxWatched: 0
        };
      }
    }

    function saveWatchState(videoId, position, maxWatched) {
      const key = getWatchKey(videoId);
    
      if (!key) return;
    
      localStorage.setItem(
        key,
        JSON.stringify({
          position: Math.max(0, Number(position || 0)),
          maxWatched: Math.max(0, Number(maxWatched || 0)),
          savedAt: Date.now()
        })
      );
    }

    function createYouTubePlayer(video) {
      const elementId = `youtube-player-${video.video_id}`;
    
      const element = document.getElementById(elementId);
    
      if (!element) return;
    
      const youtubeId = extractYouTubeId(video.url_video);
    
      if (!youtubeId) {
        element.innerHTML = `
          <div style="
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            padding:20px;
            text-align:center;
          ">
            Video tidak dapat dimuat.
          </div>
        `;
        return;
      }
    
      const state = getWatchState(video.video_id);
    
      youtubePlayers[video.video_id] = new YT.Player(
        elementId,
        {
          videoId: youtubeId,
    
          playerVars: {
            autoplay: 0,
            controls: 1,
            rel: 0,
            playsinline: 1,
            fs: 1,
            iv_load_policy: 3,
            disablekb: 1
          },
    
          events: {
            onReady: event => {
              const duration = event.target.getDuration();
    
              if (duration > 0 && !video.durasi_detik) {
                video.durasi_detik = Math.round(duration);
              }
    
              updateWatchStatus(video);
    
              if (state.position > 0 && !video.selesai) {
                event.target.seekTo(
                  Math.min(
                    state.position,
                    state.maxWatched
                  ),
                  true
                );
              }
            },
    
            onStateChange: event => {
              handleYouTubeStateChange(
                event,
                video
              );
            }
          }
        }
      );
    }

    function handleYouTubeStateChange(event, video) {
      const player = event.target;
    
      if (!player || typeof player.getCurrentTime !== 'function') {
        return;
      }
    
      const videoId = video.video_id;
    
      if (event.data === YT.PlayerState.PLAYING) {
    
        if (!watchSaveTimers[videoId]) {
          watchSaveTimers[videoId] = setInterval(() => {
    
            const currentPlayer = youtubePlayers[videoId];
    
            if (!currentPlayer) return;
    
            const currentTime =
              currentPlayer.getCurrentTime();
    
            const state =
              getWatchState(videoId);
    
            /*
             * Jika posisi sekarang lebih jauh
             * dari posisi maksimal yang sudah ditonton,
             * berarti pengguna benar-benar menonton maju.
             */
            if (currentTime > state.maxWatched + 1) {
              state.maxWatched = currentTime;
            }
    
            state.position = currentTime;
    
            saveWatchState(
              videoId,
              state.position,
              state.maxWatched
            );
    
            updateWatchStatus(video);
    
          }, 1000);
        }
    
      } else {
    
        if (watchSaveTimers[videoId]) {
          clearInterval(
            watchSaveTimers[videoId]
          );
    
          delete watchSaveTimers[videoId];
        }
    
        const currentTime =
          player.getCurrentTime();
    
        const state =
          getWatchState(videoId);
    
        saveWatchState(
          videoId,
          currentTime,
          state.maxWatched
        );
      }
    
      /*
       * VIDEO SELESAI
       */
      if (event.data === YT.PlayerState.ENDED) {
    
        if (watchSaveTimers[videoId]) {
          clearInterval(
            watchSaveTimers[videoId]
          );
    
          delete watchSaveTimers[videoId];
        }
    
        saveWatchState(
          videoId,
          player.getDuration(),
          player.getDuration()
        );
    
        completeVideo(
          activeModuleId,
          videoId
        );
      }
    }

    function monitorYouTubeSeeking(video) {
      const videoId = video.video_id;
    
      const timer = setInterval(() => {
    
        const player =
          youtubePlayers[videoId];
    
        if (!player) return;
    
        if (
          player.getPlayerState() !==
          YT.PlayerState.PLAYING
        ) {
          return;
        }
    
        const currentTime =
          player.getCurrentTime();
    
        const state =
          getWatchState(videoId);
    
        /*
         * Toleransi 2 detik untuk menghindari
         * false detection karena buffering.
         */
        if (
          currentTime >
          state.maxWatched + 2
        ) {
    
          player.seekTo(
            state.maxWatched,
            true
          );
    
          state.position =
            state.maxWatched;
    
          saveWatchState(
            videoId,
            state.maxWatched,
            state.maxWatched
          );
        }
    
      }, 500);
    
      watchSaveTimers[
        `${videoId}_seek`
      ] = timer;
    }

    function startWatching(videoId) {
      const player =
        youtubePlayers[videoId];
    
      const lock =
        document.getElementById(
          `video-lock-${videoId}`
        );
    
      if (lock) {
        lock.style.display = 'none';
      }
    
      if (!player) {
        return;
      }
    
      const state =
        getWatchState(videoId);
    
      if (state.position > 0) {
        player.seekTo(
          Math.min(
            state.position,
            state.maxWatched
          ),
          true
        );
      }
    
      player.playVideo();
    
      const video =
        activeVideos.find(
          item =>
            String(item.video_id) ===
            String(videoId)
        );
    
      if (video) {
        monitorYouTubeSeeking(video);
      }
    }
    
    async function openQuiz(moduleId, videoId) {
      showLoading('Menyiapkan kuis...');

      try {
        const result = await api('quiz', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId
        });

        const questions = result.questions || [];

        if (!questions.length) {
          await completeVideo(moduleId, videoId);
          return;
        }

        renderQuiz(moduleId, videoId, questions);
      } catch (error) {
        alert(error.message);
        openModule(moduleId);
      }
    }

    function renderQuiz(moduleId, videoId, questions) {
      const questionHtml = questions.map((question, index) => `
        <article class="module">
          <h2>Soal ${index + 1}</h2>
          <p style="font-weight:bold; color:#1c2d26;">
            ${escapeHtml(question.pertanyaan)}
          </p>

          ${['A', 'B', 'C', 'D'].map(option => `
            <label style="font-weight:normal; display:flex; gap:10px; align-items:flex-start; margin:13px 0;">
              <input type="radio" required
                name="${escapeHtml(question.question_id)}"
                value="${option}"
                style="width:auto; margin-top:2px;">
              <span>${option}. ${escapeHtml(question[`opsi_${option.toLowerCase()}`])}</span>
            </label>
          `).join('')}
        </article>
      `).join('');

      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Kuis Video</h1>
              <p>Semua jawaban harus benar untuk melanjutkan.</p>
            </div>

            <form id="quizForm">
              ${questionHtml}

              <div id="quizResult" class="message"></div>

              <button type="submit">Kirim Jawaban</button>

              <button class="logout" type="button" onclick="openModule('${escapeHtml(moduleId)}')">
                Kembali ke Video
              </button>
            </form>
          </section>
        </main>
      `;

      document.getElementById('quizForm').addEventListener('submit', event => {
        submitQuiz(event, moduleId, videoId, questions);
      });
    }

    async function submitQuiz(event, moduleId, videoId, questions) {
      event.preventDefault();

      const form = event.currentTarget;
      const button = form.querySelector('button[type="submit"]');
      const resultBox = document.getElementById('quizResult');
      const answers = Object.fromEntries(new FormData(form).entries());

      button.disabled = true;
      button.textContent = 'Memeriksa jawaban...';

      try {
        const result = await api('submitQuiz', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId,
          answers: JSON.stringify(answers)
        });

        if (result.lulus) {
          openModule(moduleId);
          return;
        }

        const salah = result.results
          .filter(item => !item.benar)
          .map(item => {
            const question = questions.find(
              question => question.question_id === item.question_id
            );

            const textJawabanBenar = question[
              `opsi_${item.jawaban_benar.toLowerCase()}`
            ];

            const nomorSoal = questions.findIndex(
              question => question.question_id === item.question_id
            ) + 1;

            const jawabanMahasiswa = String(
              answers[item.question_id] || '-'
            ).toUpperCase();

            const textJawabanMahasiswa = question[
              `opsi_${jawabanMahasiswa.toLowerCase()}`
            ] || '-';

            return `
              <li style="margin-bottom:10px;">
                <b>Soal ${nomorSoal}</b><br>
                Jawaban Anda:
                <b style="color:#b91c1c;">
                  ${escapeHtml(jawabanMahasiswa)}.
                  ${escapeHtml(textJawabanMahasiswa)}
                </b><br>
                Jawaban benar:
                <b style="color:#006747;">
                  ${item.jawaban_benar}.
                  ${escapeHtml(textJawabanBenar)}
                </b>
              </li>
            `;
          }).join('');

        resultBox.className = 'message error';
        resultBox.innerHTML = `
          <b>Masih ada jawaban yang salah.</b>
          <ul style="margin:8px 0 0; padding-left:20px;">${salah}</ul>
          <p style="margin:10px 0 0;">Perbaiki jawaban Anda, lalu kirim kembali.</p>
        `;

        button.disabled = false;
        button.textContent = 'Kirim Jawaban';
      } catch (error) {
        resultBox.className = 'message error';
        resultBox.textContent = error.message;
        button.disabled = false;
        button.textContent = 'Kirim Jawaban';
      }
    }

    async function completeVideo(moduleId, videoId) {
      try {
        await api('completeVideo', {
          token: sessionToken,
          moduleId: moduleId,
          videoId: videoId
        });

        openModule(moduleId);
      } catch (error) {
        alert(error.message);
      }
    }

    function fileToBase64_(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
    
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(
          new Error('File tidak dapat dibaca.')
        );
    
        reader.readAsDataURL(file);
      });
    }
    
    async function uploadDocument(
      jenisDokumen,
      namaDokumen,
      inputId
    ) {
      const input = document.getElementById(inputId);
    
      if (!input || !input.files.length) {
        alert('Silakan pilih file terlebih dahulu.');
        return;
      }
    
      const file = input.files[0];
    
      if (file.size > 1024 * 1024) {
        alert('Ukuran file maksimal 1 MB.');
        return;
      }
    
      const allowedTypes = [
        'image/jpeg',
        'image/png',
        'application/pdf'
      ];
    
      if (!allowedTypes.includes(file.type)) {
        alert('Format file harus JPG, JPEG, PNG, atau PDF.');
        return;
      }
    
      try {
        showLoading('Mengunggah dokumen...');
    
        const fileData = await fileToBase64_(file);
    
        const result = await api('uploadDocument', {
          token: sessionToken,
          jenisDokumen: jenisDokumen,
          namaDokumen: namaDokumen || '',
          fileName: file.name,
          mimeType: file.type,
          fileData: fileData
        });
    
        alert(`Berhasil mengunggah:\n${result.nama_file}`);
    
        renderDashboard();
    
      } catch (error) {
        alert(error.message);
        renderDashboard();
      }
    }

    async function renderDocuments() {
      const container = document.getElementById('documentList');
    
      if (!container) return;
    
      try {
        const result = await api('documents', {
          token: sessionToken
        });
    
        const documents = result.documents || [];
    
        const wajib = [
          'Akta Kelahiran',
          'KTP',
          'Kartu Keluarga',
          'Ijazah Terakhir',
          'Transkrip Terakhir'
        ];
    
        const uploaded = {};
    
        documents.forEach(doc => {
          uploaded[doc.jenis_dokumen] = doc;
        });
    
        container.innerHTML = `
          ${wajib.map((jenis, index) => {
            const doc = uploaded[jenis];
    
            return `
              <div class="document-item">
                <div class="document-title">
                  <strong>${index + 1}. ${jenis}</strong>
                  <span class="${doc ? 'document-done' : 'document-required'}">
                    ${doc ? '✓ Sudah diunggah' : 'Wajib'}
                  </span>
                </div>
    
                ${
                  doc
                    ? `<small>${escapeHtml(doc.nama_file)}</small>`
                    : ''
                }
    
                <input
                  type="file"
                  id="document-${index}"
                  accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"
                >
    
                <button
                  type="button"
                  onclick="uploadDocument(
                    '${escapeHtml(jenis)}',
                    '',
                    'document-${index}'
                  )">
                  ${doc ? 'Ganti Dokumen' : 'Unggah Dokumen'}
                </button>
              </div>
            `;
          }).join('')}
    
          <div class="document-item">
            <div class="document-title">
              <strong>Dokumen Lainnya</strong>
              <span class="document-optional">Opsional</span>
            </div>
    
            <input
              id="otherDocumentName"
              type="text"
              placeholder="Nama dokumen, misalnya Surat Pindah"
            >
    
            <input
              type="file"
              id="document-other"
              accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"
            >
    
            <button
              type="button"
              onclick="uploadDocument(
                'Dokumen Lainnya',
                document.getElementById('otherDocumentName').value.trim(),
                'document-other'
              )">
              Tambah Dokumen
            </button>
    
            <div id="otherDocuments"></div>
          </div>
        `;
    
        renderOtherDocuments(documents);
    
      } catch (error) {
        container.innerHTML = `
          <p class="message error">
            ${escapeHtml(error.message)}
          </p>
        `;
      }
    }

    function renderOtherDocuments(documents) {
      const container = document.getElementById('otherDocuments');
    
      if (!container) return;
    
      const others = documents.filter(
        doc => doc.jenis_dokumen === 'Dokumen Lainnya'
      );
    
      if (!others.length) {
        container.innerHTML = '';
        return;
      }
    
      container.innerHTML = `
        <div class="other-document-list">
          <strong>Dokumen tambahan:</strong>
    
          ${others.map(doc => `
            <div class="other-document-row">
              <span>
                ✓ ${escapeHtml(doc.nama_file)}
              </span>
            </div>
          `).join('')}
        </div>
      `;
    }
    
    function toEmbedUrl(url) {
      const value = String(url || '').trim();
    
      // Google Drive
      const driveMatch =
        value.match(/\/d\/([^/]+)/) ||
        value.match(/[?&]id=([^&]+)/);
    
      if (value.includes('drive.google.com') && driveMatch) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }
    
      // YouTube Shorts
      const shortsMatch = value.match(
        /youtube\.com\/shorts\/([^?&/]+)/
      );
    
      if (shortsMatch) {
        return `https://www.youtube.com/embed/${shortsMatch[1]}`;
      }
    
      // YouTube biasa
      const youtubeMatch = value.match(
        /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^?&/]+)/
      );
    
      if (youtubeMatch) {
        return `https://www.youtube.com/embed/${youtubeMatch[1]}`;
      }
    
      return value;
    }
    
    function showDeclaration(moduleId) {
      app.innerHTML = `
        <main class="container">
          <section class="card">
            <div class="brand">
              <h1>Finalisasi Modul</h1>
              <p>Pastikan Anda sudah memahami seluruh panduan pada modul ini.</p>
            </div>
    
            <form id="declarationForm">
              <article class="module">
                <p style="line-height:1.6;">
                  Saya menyatakan telah mengikuti seluruh panduan dan memahami
                  informasi pada modul ini.
                </p>
    
                <label style="font-weight:normal;display:flex;gap:10px;align-items:flex-start;">
                  <input id="acceptDeclaration" type="checkbox"
                    style="width:auto;margin-top:3px;">
                  <span>Saya setuju dengan pernyataan di atas.</span>
                </label>
              </article>
    
              <button type="submit">Setujui dan Finalisasi</button>
              <button class="logout" type="button" onclick="renderDashboard()">
                Kembali
              </button>
    
              <div id="declarationMessage" class="message"></div>
            </form>
          </section>
        </main>
      `;
    
      document.getElementById('declarationForm').addEventListener('submit', event => {
        submitDeclaration(event, moduleId);
      });
    }
    
    async function submitDeclaration(event, moduleId) {
      event.preventDefault();
    
      const accepted = document.getElementById('acceptDeclaration').checked;
      const message = document.getElementById('declarationMessage');
    
      if (!accepted) {
        message.className = 'message error';
        message.textContent = 'Centang persetujuan pernyataan terlebih dahulu.';
        return;
      }
    
      showLoading('Menyimpan finalisasi...');
    
      try {
        await api('declare', {
          token: sessionToken,
          moduleId: moduleId,
          accepted: true
        });
    
        renderDashboard();
      } catch (error) {
        alert(error.message);
        showDeclaration(moduleId);
      }
    }

    function logout() {
      localStorage.removeItem('portalUser');
      localStorage.removeItem('portalToken');

      currentUser = null;
      sessionToken = null;

      renderLogin();
    }

    if (currentUser && sessionToken) {
      if (String(currentUser.role).toLowerCase() === 'admin') {
        renderAdminDashboard();
      } else {
        renderDashboard();
      }
    } else {
      renderLogin();
    }
  </script>
</body>
